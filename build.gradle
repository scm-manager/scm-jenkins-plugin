plugins {
  id 'org.scm-manager.smp' version '0.21.1'
}

dependencies {
  plugin "sonia.scm.plugins:scm-el-plugin:3.0.1-SNAPSHOT"
  optionalPlugin "sonia.scm.plugins:scm-review-plugin:4.0.0-SNAPSHOT"
  optionalPlugin "sonia.scm.plugins:scm-ssh-plugin:4.0.0-SNAPSHOT"
  optionalPlugin "sonia.scm.plugins:scm-mail-plugin:4.0.0-SNAPSHOT"
}

scmPlugin {
  scmVersion = "4.0.0-SNAPSHOT"
  displayName = "Jenkins"
  description = "Pings your Jenkins CI server when a new commit is pushed to SCM-Manager"
  author = "Cloudogu GmbH"
  category = "Continuous Integration"
  avatarUrl = '/images/jenkins-logo.png'

  openapi {
    packages = [
      "sonia.scm.jenkins",
    ]
  }
}
